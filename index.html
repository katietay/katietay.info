<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1b3a2d;
      color: #e8e0d4;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      padding: 2rem;
    }

    .container {
      max-width: 600px;
    }

    .icon {
      margin-bottom: 2rem;
    }

    .icon svg {
      width: 120px;
      height: 120px;
    }

    .cone {
      fill: #d4a054;
    }

    .stripe {
      fill: #1b3a2d;
    }

    .cone-base {
      fill: #b8864a;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1.4;
      color: #6fcf97;
      text-transform: uppercase;
    }

    p {
      margin-top: 1rem;
      font-size: 1.1rem;
      color: #b0c9b8;
    }

    .bar {
      margin-top: 2.5rem;
      height: 4px;
      background: #2a5c45;
      border-radius: 2px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 30%;
      background: #6fcf97;
      border-radius: 2px;
      animation: progress 2s ease-in-out infinite alternate;
    }

    @keyframes progress {
      from { width: 10%; }
      to   { width: 90%; }
    }

    @media (max-width: 480px) {
      body { padding: 1.5rem; }
      .icon svg { width: 80px; height: 80px; }
      h1 { font-size: 1.3rem; }
      p { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <!-- Traffic cone SVG -->
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <rect class="cone-base" x="20" y="100" width="80" height="12" rx="3"/>
        <polygon class="cone" points="60,10 85,100 35,100"/>
        <rect class="stripe" x="44" y="42" width="32" height="8" rx="1" transform="rotate(0,60,46)"/>
        <rect class="stripe" x="38" y="62" width="44" height="8" rx="1" transform="rotate(0,60,66)"/>
        <rect class="stripe" x="32" y="82" width="56" height="8" rx="1" transform="rotate(0,60,86)"/>
        <ellipse class="cone" cx="60" cy="10" rx="6" ry="4"/>
      </svg>
    </div>
    <h1>Construction in Progress</h1>
    <p>Check back soon for an awesome new experience</p>
    <div class="bar">
      <div class="bar-fill"></div>
    </div>
  </div>
</body>
</html>
